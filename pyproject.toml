[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "dlpro"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26", "pandas>=2", "cooler>=0.10", "matplotlib>=3.8"]
[project.optional-dependencies]
test = ["pytest>=8"]
report = ["python-docx>=1.1"]
experiment = ["torch>=2.2", "scikit-learn>=1.4", "scikit-image>=0.22", "openpyxl>=3.1"]
[project.scripts]
dlpro = "dlpro.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
